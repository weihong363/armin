name: armin
description: Voice-first task delegation layer for Codex CLI over SSH.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  dartssh2: ^2.17.1
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  path_provider: ^2.1.5
  speech_to_text: ^7.3.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
